# yaml-language-server: $schema=../schema/config.schema.json
# Design example. You cannot run it directly. You must supply the helpers and drivers.
# The computer that a command belongs to runs that command. No shell runs a command.
version: 1
computers:
  mac:
    label: MacBook
    path: [/opt/homebrew/bin, /usr/local/bin, /usr/bin, /bin]   # finds lg-helper
    endpoint: {host: mac.local, port: 24800}
    devices:
      Desktop:                         # Only a local alias. It is not for matching OS names.
        id: shared-lg                  # The shared ID of the same physical device
        portal-match:
          driver: exec                 # exit 0: the portal is on this display
          command: lg-helper is-portal-display
        input-target:
          driver: command              # protocol 2: returns a display token as JSON
          command: [lg-helper, input-target]
        verify:
          driver: prompt               # after a handoff to the Mac: the prompt on this display
        handoff:
          pc1:
            steps:
              - driver: exec
                timeout-ms: 3000
                command: lg-helper select dp
          pc2:
            steps:
              - driver: exec
                command: [lg-helper, select, hdmi]
      BuiltIn:
        id: mac-internal               # Connects only to the Mac. It has no switchable targets.
        portal-match:
          driver: display              # built in: compares the display metadata, runs no program
          match: {builtin: true}
      USB:
        id: shared-usb                 # Generic device. It needs no display-identification fields.
        verify:
          driver: exec                 # a check with no user: exit 0 when the hub selects the Mac
          command: [/bin/sh, -c, "system_profiler SPUSBDataType | grep -q 'USB Hub'"]
        handoff:
          pc1:
            steps:
              - driver: lab.http       # Example extension driver. It is not built in.
                options:
                  method: POST
                  url: http://usb-controller.local/select
                  json: {port: 2}
  pc1:
    label: Linux Workstation
    hint: "Copy/paste: Ctrl+C / Ctrl+V. Terminal: Ctrl+Shift+C / Ctrl+Shift+V."
    clipboard: {text: false}         # start with the text clipboard switch off (CLIP-1; the default is on)
    scroll-speed: 0.4                # multiply the scroll that this computer receives (IN-14; the default is 1)
    disabled-quirks: []              # the platform workarounds that this computer does not use (IN-16; the default is none)
    endpoint: {host: pc1.local, port: 24800}
    devices:
      Monitor1:
        id: shared-lg
        portal-match:
          driver: exec
          command: [/home/me/bin/lg-helper, is-portal-display]
        input-target:
          driver: command
          command: [/home/me/bin/lg-helper, input-target]
        verify:
          driver: prompt
        handoff:
          mac:
            steps:
              - driver: exec
                command: ddcutil --mfg GSM setvcp xF4 x0091 --i2c-source-addr=x50 --noverify
          pc2:
            steps:
              - driver: exec
                command: [/home/me/bin/lg-helper, select, hdmi]
      SideScreen:
        id: side-screen                # Connects only to PC1 and PC2
        portal-match:
          driver: exec
          command: [/home/me/bin/side-helper, is-portal-display]
        input-target:
          driver: command
          command: [/home/me/bin/side-helper, input-target]
        handoff:
          pc2:
            steps:
              - driver: exec
                command: [/home/me/bin/side-helper, select, pc2]
      Hub:
        id: shared-usb
        handoff:
          mac:
            steps:
              - driver: lab.http
                options:
                  method: POST
                  url: http://usb-controller.local/select
                  json: {port: 1}
  pc2:
    endpoint: {host: pc2.local, port: 24800}
    devices:
      MyScreen:
        id: shared-lg
        input-target:
          driver: command
          command: [/opt/bin/lg-helper, input-target]
        verify:
          driver: command              # a custom verifier in JSON lines (docs/config.md)
          timeout-ms: 90000
          command: [/opt/bin/lg-helper, verify]
        handoff:
          mac:
            steps:
              - driver: exec
                command: [/opt/bin/lg-helper, select, usb-c]
      OtherScreen:
        id: side-screen
        input-target:
          driver: command
          command: [/opt/bin/side-helper, input-target]
        handoff:
          pc1:
            steps:
              - driver: exec
                command: [/opt/bin/side-helper, select, pc1]
