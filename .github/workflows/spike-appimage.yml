# Spike 9 (temporary): build an AppImage of the Linux UI on AlmaLinux 9, then
# run it on older and newer distributions with no display. Remove this file
# with the spike branch.
name: spike-appimage

on:
  push:
    branches: [spike/appimage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y --setopt=install_weak_deps=False install git gcc-c++ cmake ninja-build python3-pip gettext xz bzip2 file findutils which binutils \
            zlib-devel bzip2-devel xz-devel libzstd-devel openssl-devel hunspell-devel mesa-libGL-devel mesa-libEGL-devel \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel fontconfig-devel freetype-devel dbus-devel \
            libX11-devel libxcb-devel xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-cursor \
            patchelf desktop-file-utils
      - uses: actions/checkout@v4
      # Save the built frameworks also after a failure, so that the next run
      # continues from the first framework that failed.
      - uses: actions/cache/restore@v4
        with:
          path: spikes/appimage/work/kf6
          key: kf6-6.20.0-qt6.12.0-alma9-${{ github.run_id }}
          restore-keys: kf6-6.20.0-qt6.12.0-alma9-
      - run: sh spikes/appimage/build.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: spikes/appimage/work/kf6
          key: kf6-6.20.0-qt6.12.0-alma9-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: spikes/appimage/out/*.AppImage

  run:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:43"]
    container: ${{ matrix.image }}
    steps:
      # Only the libraries that the AppImage expects from the host, each one by
      # name, with no recommended or weak dependencies. A missing one then
      # shows as a load error, and the list is the dependency list of the AppImage.
      - name: Install the host libraries that the AppImage does not bundle
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 \
              fonts-dejavu-core libxkbcommon0 libdbus-1-3 libglib2.0-0
          else
            dnf -y --setopt=install_weak_deps=False install mesa-libGL mesa-libEGL libglvnd-opengl fontconfig \
              freetype dejavu-sans-fonts libxkbcommon dbus-libs glib2
          fi
          ldd --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - run: |
          chmod +x Telescreen-preview-x86_64.AppImage
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=0 timeout 60 \
            ./Telescreen-preview-x86_64.AppImage --appimage-extract-and-run fixtures/main-idle.json "$PWD/shot.png"
          ls -l shot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ strategy.job-index }}
          path: shot.png
