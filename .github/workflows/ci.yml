# Run the tests for each pull request to the release branch (DIST-3). The checks
# "linux" and "macos" are required on that branch, so that auto-merge waits for them.
name: ci

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace
