# Run the tests for each pull request to the release branch (DIST-3). The checks
# "linux", "arch", and "macos" are required on that branch, so that auto-merge
# waits for them (DIST-6).
name: ci

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config qt6-base-dev qt6-declarative-dev qmake6
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # A pull request restores only its own caches and the caches of the
      # base branch. The release workflow saves the same key on that branch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-
      - run: cargo test --workspace
      # The install methods and the release files (DIST-6 to DIST-11), with stubs.
      - run: sh scripts/tests/install_test.sh && sh scripts/tests/package_release_test.sh

  # The Qt of Arch is newer than the Qt of Ubuntu (DIST-6).
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust qt6-base qt6-declarative qt6-wayland kirigami qqc2-desktop-style libxkbcommon wayland
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-arch-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-arch-
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # A pull request restores only its own caches and the caches of the
      # base branch. The release workflow saves the same key on that branch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - run: cargo test --workspace
      # The bundle with the Control Center extension. The App Intents metadata
      # must come from the Xcode tool, not from the fallback (spike 8).
      - name: Build the app bundle
        env:
          TELESCREEN_REQUIRE_XCODE: "1"
        run: scripts/make-macos-app.sh "$RUNNER_TEMP/app"
