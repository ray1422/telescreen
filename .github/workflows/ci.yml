# Run the tests for each pull request to the release branch (DIST-3). The checks
# "linux" and "macos" are required on that branch, so that auto-merge waits for them.
name: ci

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config qt6-base-dev qt6-declarative-dev qmake6
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # A pull request restores only its own caches and the caches of the
      # base branch. The release workflow saves the same key on that branch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # A pull request restores only its own caches and the caches of the
      # base branch. The release workflow saves the same key on that branch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - run: cargo test --workspace
      # The bundle with the Control Center extension. The App Intents metadata
      # must come from the Xcode tool, not from the fallback (spike 8).
      - name: Build the app bundle
        env:
          TELESCREEN_REQUIRE_XCODE: "1"
        run: scripts/make-macos-app.sh "$RUNNER_TEMP/app"
