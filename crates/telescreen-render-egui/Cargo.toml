[package]
name = "telescreen-render-egui"
description = "egui renderer of the Telescreen view models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
telescreen-view.workspace = true
telescreen-core.workspace = true
thiserror.workspace = true
egui.workspace = true
egui-winit.workspace = true
pollster.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
