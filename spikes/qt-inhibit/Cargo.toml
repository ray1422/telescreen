[package]
name = "qt-inhibit"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[build-dependencies]
cxx-qt-build = "0.10"
