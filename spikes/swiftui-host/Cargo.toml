[package]
name = "swiftui-host"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSThread", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSPanel", "NSView", "NSResponder", "NSColor", "NSGraphics", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSScreen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
